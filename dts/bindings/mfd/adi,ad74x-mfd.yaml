description: Analog Devices AD74x MFD Parent (AD74416H / AD74115H)
compatible: "adi,ad74x-mfd"
include: [spi-device.yaml]
properties:
  chip-type:
    type: string
    required: true
    enum: ["ad74416h", "ad74115h"]
  reset-gpios:
    type: phandle-array
  adc-rdy-gpios:
    type: phandle-array